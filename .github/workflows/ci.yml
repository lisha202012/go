name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: GAP mission-group mapping audit
        run: npm run check:gap-mapping -w @gofam/api

      - name: GAP reverse-item theme audit
        run: npm run check:gap-reverse -w @gofam/api

      - name: GAP content guard (client-visible environments)
        run: npm run check:gap-content -w @gofam/api
        env:
          GOFAM_DEPLOY_ENV: production

      - name: Unit tests
        run: npm run test -w @gofam/api
